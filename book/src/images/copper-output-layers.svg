  <text x="347" y="513" class="title" id="text22">Runtime completion + output ownership</text>
  <text x="347" y="537" class="sub" id="text23">Inline or async output pass; keyframe precedes its CopperList.</text>
  <path d="M720 555 L720 575" class="line" id="path23" />
  <rect x="330" y="575" width="780" height="70" rx="10" fill="#103c36" stroke="#5eead4" stroke-width="1.4" id="rect23" />
  <text x="347" y="603" class="title" id="text24">WriteStream&lt;Record&gt;::log(&amp;record)</text>
  <text x="347" y="627" class="sub" id="text25">[Rust] impl WriteStream&lt;Record&gt; • runtime attachment: core wiring</text>
  <path d="M720 645 L720 665" class="line" id="path25" />
  <rect x="330" y="665" width="780" height="70" rx="10" fill="#302f35" stroke="#aaa6b3" stroke-width="1.4" id="rect25" />
  <text x="347" y="693" class="title" id="text26">Generated OptionalWriteStream / StaticFanoutSink</text>
  <text x="347" y="717" class="sub" id="text27">Local and streaming branches consume semantic records independently.</text>
  <path d="M550 735 L375 785" class="line" id="path27" />
  <path d="M890 735 L1065 785" class="line" id="path28" />
  <text x="70" y="775" class="title" id="text28">LOCAL STORAGE</text>
  <text x="760" y="775" class="title" id="text29">LOGSTREAM</text>
  <rect x="70" y="795" width="610" height="70" rx="10" fill="#132e4a" stroke="#60a5fa" stroke-width="1.4" id="rect29" />
  <text x="87" y="823" class="title" id="text30">LogStream&lt;S, L&gt;</text>
  <text x="87" y="847" class="sub" id="text31">[Core wiring] concrete stream over injected logger/storage</text>
  <path d="M375 865 L375 889" class="line" id="path31" />
  <rect x="70" y="889" width="610" height="70" rx="10" fill="#103c36" stroke="#5eead4" stroke-width="1.4" id="rect31" />
  <text x="87" y="917" class="title" id="text32">SectionStorage → ByteSection&lt;Region&gt;</text>
  <text x="87" y="941" class="sub" id="text33">[Builder] with_logger::&lt;YourSection, YourLogger&gt;(...)</text>
  <path d="M375 959 L375 983" class="line" id="path33" />
