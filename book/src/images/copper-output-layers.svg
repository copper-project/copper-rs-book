  <text x="655" y="126" class="sub" id="text6">Internal / core change</text>
  <rect x="70" y="195" width="610" height="70" rx="10" fill="#352953" stroke="#c4a0ff" stroke-width="1.4" id="rect7" />
  <text x="87" y="223" class="title" id="text8">MESSAGE • CuTask / CuSrcTask::process</text>
  <text x="87" y="247" class="sub" id="text9">[RON] tasks[].type</text>
  <rect x="760" y="195" width="610" height="70" rx="10" fill="#103c36" stroke="#5eead4" stroke-width="1.4" id="rect9" />
  <text x="777" y="223" class="title" id="text10">STATE • Freezable::freeze / thaw</text>
  <text x="777" y="247" class="sub" id="text11">[Rust] impl Freezable for YourTask</text>
