  <rect x="760" y="285" width="610" height="70" rx="10" fill="#302f35" stroke="#aaa6b3" stroke-width="1.4" id="rect13" />
  <text x="777" y="313" class="title" id="text14">Generated capture + KeyFramesManager</text>
  <text x="777" y="337" class="sub" id="text15">Snapshot framing, scheduling and component order.</text>
