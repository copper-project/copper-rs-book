  <path d="M375 355 L375 375" class="line" id="path17" />
  <rect x="760" y="375" width="610" height="70" rx="10" fill="#132e4a" stroke="#60a5fa" stroke-width="1.4" id="rect17" />
  <text x="777" y="403" class="title" id="text18">KeyFrame</text>
  <text x="777" y="427" class="sub" id="text19">Public replay record containing component snapshots.</text>
