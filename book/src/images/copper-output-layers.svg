  <rect x="70" y="1171" width="610" height="70" rx="10" fill="#41351d" stroke="#facc70" stroke-width="1.4" id="rect37" />
  <text x="87" y="1199" class="title" id="text38">MmapRegion → mapped pages → OS → disk</text>
  <text x="87" y="1223" class="sub" id="text39">Native section headers + encoded records in slab files.</text>
  <rect x="760" y="795" width="610" height="70" rx="10" fill="#132e4a" stroke="#60a5fa" stroke-width="1.4" id="rect39" />
  <text x="777" y="823" class="title" id="text40">ScheduledCopperListSink / ScheduledKeyFrameSink</text>
  <text x="777" y="847" class="sub" id="text41">Encode bincode records or generated reconstruction capture.</text>
  <path d="M1065 865 L1065 889" class="line" id="path41" />
  <rect x="760" y="889" width="610" height="70" rx="10" fill="#302f35" stroke="#aaa6b3" stroke-width="1.4" id="rect41" />
  <text x="777" y="917" class="title" id="text42">Record header + bounded buffers / queue</text>
  <text x="777" y="941" class="sub" id="text43">Ownership, backpressure and handoff to sender worker.</text>
  <path d="M1065 959 L1065 983" class="line" id="path43" />
  <rect x="760" y="983" width="610" height="70" rx="10" fill="#302f35" stroke="#aaa6b3" stroke-width="1.4" id="rect43" />
  <text x="777" y="1011" class="title" id="text44">Sender: framing + FEC + pacing + recovery</text>
  <text x="777" y="1035" class="sub" id="text45">[RON] link / fec / recovery_interval tune values; no type replacement</text>
  <path d="M1065 1053 L1065 1077" class="line" id="path45" />
  <rect x="760" y="1077" width="610" height="70" rx="10" fill="#352953" stroke="#c4a0ff" stroke-width="1.4" id="rect45" />
  <text x="777" y="1105" class="title" id="text46">CuStreamTx → transport adapter</text>
  <text x="777" y="1129" class="sub" id="text47">[T] RON transport type + resource • or builder.with_logstream(...)</text>
  <path d="M1065 1147 L1065 1171" class="line" id="path47" />
  <rect x="760" y="1171" width="610" height="70" rx="10" fill="#41351d" stroke="#facc70" stroke-width="1.4" id="rect47" />
  <text x="777" y="1199" class="title" id="text48">Packet bytes on the link</text>
  <text x="777" y="1223" class="sub" id="text49">Independent of .copper file/slab framing.</text>
