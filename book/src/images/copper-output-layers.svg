nt-size:13px">Private encoder writer</text><rect x="380.0" y="1077.0" width="300.0" height="70" rx="10" fill="#103c36" stroke="#5eead4" stroke-width="1.4" /><text x="392.0" y="1104.0" class="title" style="font-size:17px">ByteRegion::write</text><text x="392.0" y="1128.0" class="sub" style="font-size:13px">[Rust] backend region impl</text><rect x="70.0" y="1290.0" width="426.6666666666667" height="70" rx="10" fill="#103c36" stroke="#5eead4" stroke-width="1.4" /><text x="82.0" y="1317.0" class="title" style="font-size:17px">UnifiedLogWrite&lt;S&gt;</text><text x="82.0" y="1341.0" class="sub" style="font-size:13px">[Builder] with_logger::&lt;S, L&gt;(logger)</text><rect x="506.6666666666667" y="1290.0" width="426.6666666666667" height="70" rx="10" fill="#132e4a" stroke="#60a5fa" stroke-width="1.4" /><text x="518.6666666666667" y="1317.0" class="title" style="font-size:17px">ByteLogger&lt;B&gt;</text><text x="518.6666666666667" y="1341.0" class="sub" style="font-size:13px">Fixed allocator / layout / retention logic</text><rect x="943.3333333333334" y="1290.0" width="426.6666666666667" height="70" rx="10" fill="#103c36" stroke="#5eead4" stroke-width="1.4" /><text x="955.3333333333334" y="1317.0" class="title" style="font-size:17px">ByteStorage / ByteRegion</text><text x="955.3333333333334" y="1341.0" class="sub" style="font-size:13px">[Rust] backend impl → ByteLogger → builder</text><text x="70" y="1412" class="sub">[C] logging.codecs[].type → tasks[].logging.codec / codecs</text><text x="70" y="1440" class="sub">[T] log_streaming.destinations[].transport.{type, resource} → resources[].{id, provider}</text></svg>